<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
  <title id="title">EIUS Lab</title>
  <desc id="desc">Drones take off and hover on both sides, linked by a network with glowing signal dots travelling along the connections.</desc>

  <style>
    .link { fill: none; stroke: #38e1ff; stroke-opacity: .22; stroke-width: 1.5; }
    .flow { fill: none; stroke: #7fefff; stroke-opacity: .55; stroke-width: 1.5; stroke-dasharray: 3 15; animation: flow 1.8s linear infinite; }
    .flow.rev { animation-direction: reverse; }
    .title { font: 700 56px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 6px; fill: #e8f6ff; }
    .subtitle { font: 400 17px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 4px; fill: #8fb4d9; }
    .star { fill: #cfe8ff; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a18"/>
      <stop offset=".65" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#0f2142"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx=".5" cy=".38" r=".45">
      <stop offset="0" stop-color="#2b5cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38e1ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fefff"/>
      <stop offset=".5" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38e1ff" stroke-opacity=".05"/>
    </pattern>

    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="drone">
      <path d="M-38 -6H38" stroke="#9fb3d9" stroke-width="3" stroke-linecap="round"/>
      <path d="M-36 -6V-12M36 -6V-12" stroke="#9fb3d9" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-36" cy="-13" rx="20" ry="2.6" fill="#38e1ff" fill-opacity=".6">
        <animate attributeName="rx" values="20;5;20" dur=".16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="36" cy="-13" rx="20" ry="2.6" fill="#38e1ff" fill-opacity=".6">
        <animate attributeName="rx" values="5;20;5" dur=".16s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M-12 3L-18 16M12 3L18 16M-23 16H-13M13 16H23" stroke="#9fb3d9" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="-17" y="-11" width="34" height="15" rx="6" fill="#16264a" stroke="#38e1ff" stroke-width="1.5"/>
      <circle cx="-8" cy="-3.5" r="1.6" fill="#ff5c8a">
        <animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="8" r="3" fill="#4fffb0" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g id="pulse">
      <circle r="14" fill="none" stroke="#38e1ff" stroke-width="1.2">
        <animate attributeName="r" values="14;48" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".55;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Network paths, mirrored around x = 600 -->
    <path id="pL12" d="M170 105L330 205"/>
    <path id="pL23" d="M330 205L140 300"/>
    <path id="pL13" d="M170 105Q100 200 140 300"/>
    <path id="pL1H" d="M170 105Q400 60 600 140"/>
    <path id="pL2H" d="M330 205Q470 200 600 140"/>
    <path id="pR12" d="M1030 105L870 205"/>
    <path id="pR23" d="M870 205L1060 300"/>
    <path id="pR13" d="M1030 105Q1100 200 1060 300"/>
    <path id="pR1H" d="M1030 105Q800 60 600 140"/>
    <path id="pR2H" d="M870 205Q730 200 600 140"/>
    <path id="pTop" d="M170 105Q600 -60 1030 105"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <rect width="1200" height="430" fill="url(#centerGlow)"/>

  <g class="star">
    <circle cx="60" cy="40" r="1"/><circle cx="250" cy="28" r="1.3"/><circle cx="420" cy="70" r=".9"/>
    <circle cx="510" cy="22" r="1.2"/><circle cx="700" cy="35" r="1"/><circle cx="780" cy="90" r=".8"/>
    <circle cx="960" cy="30" r="1.2"/><circle cx="1140" cy="55" r="1"/><circle cx="1170" cy="180" r=".9"/>
    <circle cx="30" cy="200" r=".9"/><circle cx="460" cy="330" r=".8"/><circle cx="760" cy="350" r=".9"/>
    <circle cx="350" cy="120" r="1.4">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="60" r="1.4">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="60" r="1.1">
      <animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ground and launch pads -->
  <rect x="0" y="404" width="1200" height="1.5" fill="url(#ground)"/>
  <g fill="none" stroke="#38e1ff">
    <ellipse cx="140" cy="404" rx="34" ry="6" stroke-opacity=".6"/>
    <ellipse cx="1060" cy="404" rx="34" ry="6" stroke-opacity=".6"/>
    <ellipse cx="140" cy="404" rx="34" ry="6">
      <animate attributeName="rx" values="20;56" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1060" cy="404" rx="34" ry="6">
      <animate attributeName="rx" values="20;56" dur="2s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3;10" dur="2s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2s" begin="-1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Always-on links between hovering drones and the hub -->
  <g>
    <use href="#pTop" class="link"/><use href="#pTop" class="flow"/>
    <use href="#pL12" class="link"/><use href="#pL12" class="flow"/>
    <use href="#pL1H" class="link"/><use href="#pL1H" class="flow"/>
    <use href="#pL2H" class="link"/><use href="#pL2H" class="flow rev"/>
    <use href="#pR12" class="link"/><use href="#pR12" class="flow"/>
    <use href="#pR1H" class="link"/><use href="#pR1H" class="flow"/>
    <use href="#pR2H" class="link"/><use href="#pR2H" class="flow rev"/>
  </g>

  <!-- Signal dots on always-on links -->
  <g filter="url(#glow)">
    <circle r="3.5" fill="#bdf7ff">
      <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#pTop"/></animateMotion>
    </circle>
    <circle r="3" fill="#a99bff">
      <animateMotion dur="4.5s" begin="-2.25s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pTop"/></animateMotion>
    </circle>
    <circle r="3" fill="#4fffb0">
      <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pL12"/></animateMotion>
    </circle>
    <circle r="3" fill="#4fffb0">
      <animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#pR12"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#bdf7ff">
      <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#pL1H"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#bdf7ff">
      <animateMotion dur="2.8s" begin="-1.4s" repeatCount="indefinite"><mpath href="#pR1H"/></animateMotion>
    </circle>
    <circle r="3" fill="#a99bff">
      <animateMotion dur="2.4s" begin="-.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pL2H"/></animateMotion>
    </circle>
    <circle r="3" fill="#a99bff">
      <animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pR2H"/></animateMotion>
    </circle>
  </g>

  <!-- Links to the take-off drones fade in once they are airborne -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.28;.34;.8;.84;1" dur="12s" repeatCount="indefinite"/>
    <use href="#pL23" class="link"/><use href="#pL23" class="flow"/>
    <use href="#pL13" class="link"/><use href="#pL13" class="flow rev"/>
    <g filter="url(#glow)">
      <circle r="3" fill="#4fffb0">
        <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#pL23"/></animateMotion>
      </circle>
      <circle r="3" fill="#bdf7ff">
        <animateMotion dur="2.4s" begin="-1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pL13"/></animateMotion>
      </circle>
    </g>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.28;.34;.8;.84;1" dur="12s" begin="-6s" repeatCount="indefinite"/>
    <use href="#pR23" class="link"/><use href="#pR23" class="flow"/>
    <use href="#pR13" class="link"/><use href="#pR13" class="flow rev"/>
    <g filter="url(#glow)">
      <circle r="3" fill="#4fffb0">
        <animateMotion dur="2s" begin="-.7s" repeatCount="indefinite"><mpath href="#pR23"/></animateMotion>
      </circle>
      <circle r="3" fill="#bdf7ff">
        <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pR13"/></animateMotion>
      </circle>
    </g>
  </g>

  <!-- Central hub -->
  <!-- Central AI hub: chip core with orbiting neural nodes -->
  <g transform="translate(600 140)">
    <circle r="28" fill="none" stroke="#38e1ff" stroke-width="1.5">
      <animate attributeName="r" values="28;86" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#a99bff" stroke-width="1.5">
      <animate attributeName="r" values="28;86" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" fill="none" stroke="#a99bff" stroke-opacity=".5" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <g stroke="#7fefff" stroke-opacity=".45" stroke-width="1">
        <path d="M44 0L27 0M-22 38L-14 24M-22 -38L-14 -24"/>
        <path d="M44 0L-22 38L-22 -38Z" fill="none" stroke-dasharray="2 5" stroke-opacity=".3"/>
      </g>
      <g filter="url(#glow)">
        <circle cx="44" cy="0" r="3.2" fill="#4fffb0">
          <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-22" cy="38" r="3.2" fill="#bdf7ff">
          <animate attributeName="opacity" values="1;.35;1" dur="1.2s" begin="-.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-22" cy="-38" r="3.2" fill="#a99bff">
          <animate attributeName="opacity" values="1;.35;1" dur="1.2s" begin="-.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <path d="M-12 -21V-27M-4 -21V-27M4 -21V-27M12 -21V-27M-12 21V27M-4 21V27M4 21V27M12 21V27M-21 -12H-27M-21 -4H-27M-21 4H-27M-21 12H-27M21 -12H27M21 -4H27M21 4H27M21 12H27"
      stroke="#38e1ff" stroke-width="2" stroke-linecap="round"/>
    <rect x="-21" y="-21" width="42" height="42" rx="7" fill="#0e1a33" stroke="#38e1ff" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="-15" y="-15" width="30" height="30" rx="4" fill="none" stroke="#a99bff" stroke-opacity=".55"/>
    <text y="5.5" text-anchor="middle" style="font: 800 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; fill: url(#titleGrad)" filter="url(#softGlow)">AI
      <animate attributeName="opacity" values="1;.6;1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Hovering drones -->
  <g transform="translate(170 105)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="4.4s" repeatCount="indefinite" additive="sum"/>
      <use href="#pulse"/>
      <use href="#drone"/>
    </g>
  </g>
  <g transform="translate(330 205) scale(.85)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.7s" begin="-1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="3.8s" repeatCount="indefinite" additive="sum"/>
      <use href="#pulse"/>
      <use href="#drone"/>
    </g>
  </g>
  <g transform="translate(1030 105)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.2s" begin="-1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="4.4s" repeatCount="indefinite" additive="sum"/>
      <use href="#pulse"/>
      <use href="#drone"/>
    </g>
  </g>
  <g transform="translate(870 205) scale(.85)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.7s" begin="-2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="3.8s" repeatCount="indefinite" additive="sum"/>
      <use href="#pulse"/>
      <use href="#drone"/>
    </g>
  </g>

  <!-- Take-off drones: launch from pad, hover, land, repeat -->
  <g transform="translate(140 300)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="spline"
        values="0 86;0 86;0 0;0 -7;0 0;0 -7;0 0;0 86" keyTimes="0;.08;.3;.45;.58;.7;.8;1"
        keySplines=".4 0 .2 1;.4 0 .2 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.5 0 .3 1"/>
      <use href="#drone"/>
    </g>
  </g>
  <g transform="translate(1060 300)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="12s" begin="-6s" repeatCount="indefinite" calcMode="spline"
        values="0 86;0 86;0 0;0 -7;0 0;0 -7;0 0;0 86" keyTimes="0;.08;.3;.45;.58;.7;.8;1"
        keySplines=".4 0 .2 1;.4 0 .2 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.5 0 .3 1"/>
      <use href="#drone"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="262" text-anchor="middle" class="title" fill="url(#titleGrad)" style="fill:url(#titleGrad)" filter="url(#softGlow)">EIUS Lab</text>
  <text x="600" y="300" text-anchor="middle" class="subtitle">DRONES &#183; NETWORKS &#183; SIGNAL TRANSMISSION</text>
</svg>
