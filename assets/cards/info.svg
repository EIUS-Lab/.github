<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="title desc">
  <title id="title">Lab information</title>
  <desc id="desc">Advisor: Tsai, Hua-Wen. Established: 2020. Location: Room F717.</desc>
  <style>
    .label { font: 600 12px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 2.5px; fill: #38e1ff; }
    .value { font: 700 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #e8f6ff; }
    .ic { fill: none; stroke: #38e1ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#0f2142"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38e1ff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="tile">
      <rect width="382" height="128" rx="16" fill="url(#card)" stroke="#38e1ff" stroke-opacity=".28"/>
      <rect width="382" height="128" rx="16" fill="url(#grid)"/>
    </g>
    <g id="ring">
      <circle r="36" fill="none" stroke="#a99bff" stroke-opacity=".45" stroke-dasharray="3 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="28" fill="#0e1a33" stroke="#38e1ff" stroke-opacity=".6" stroke-width="1.5"/>
    </g>
  </defs>

  <g transform="translate(1 11)">
    <use href="#tile"/>
    <rect x="24" width="80" height="2" rx="1" fill="#38e1ff"/>
    <g transform="translate(64 64)">
      <use href="#ring"/>
      <g class="ic">
        <circle cy="-6" r="6"/>
        <path d="M-11 12A11 11 0 0 1 11 12"/>
      </g>
    </g>
    <text x="124" y="52" class="label">ADVISOR</text>
    <text x="124" y="88" class="value">Tsai, Hua-Wen</text>
    <circle cx="354" cy="28" r="3" fill="#38e1ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(409 11)">
    <use href="#tile"/>
    <rect x="24" width="80" height="2" rx="1" fill="#4fffb0"/>
    <g transform="translate(64 64)">
      <use href="#ring"/>
      <g class="ic">
        <rect x="-11" y="-9" width="22" height="20" rx="3"/>
        <path d="M-11 -3H11M-5 -12V-6M5 -12V-6"/>
      </g>
      <circle cx="4" cy="5" r="2.2" fill="#4fffb0"/>
    </g>
    <text x="124" y="52" class="label">ESTABLISHED</text>
    <text x="124" y="88" class="value">2020</text>
    <circle cx="354" cy="28" r="3" fill="#4fffb0" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" begin="-.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(817 11)">
    <use href="#tile"/>
    <rect x="24" width="80" height="2" rx="1" fill="#a99bff"/>
    <g transform="translate(64 64)">
      <use href="#ring"/>
      <g class="ic">
        <path d="M0 13C-6 6 -10 1 -10 -4A10 10 0 0 1 10 -4C10 1 6 6 0 13Z"/>
        <circle cy="-4" r="3.5" stroke="#4fffb0"/>
      </g>
    </g>
    <text x="124" y="52" class="label">LOCATION</text>
    <text x="124" y="88" class="value">Room F717</text>
    <circle cx="354" cy="28" r="3" fill="#a99bff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
