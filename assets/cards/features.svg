<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">What makes us different</title>
  <desc id="desc">Cross-disciplinary integration: flight control, communication networks, and AI models are designed as one system rather than studied in isolation. From simulation to real flight: ideas are validated quickly in simulation, then taken to real flights and field tests. Hardware and software: hands-on experience across embedded systems, firmware, network protocols, and machine learning.</desc>
  <style>
    .num { font: 700 30px "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .title { font: 700 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #e8f6ff; }
    .body { font: 400 15px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8fb4d9; }
    .ic { fill: none; stroke: #38e1ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#0f2142"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38e1ff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="tile">
      <rect width="382" height="278" rx="16" fill="url(#card)" stroke="#38e1ff" stroke-opacity=".28"/>
      <rect width="382" height="278" rx="16" fill="url(#grid)"/>
    </g>
    <g id="ring">
      <circle r="36" fill="none" stroke="#a99bff" stroke-opacity=".45" stroke-dasharray="3 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="28" fill="#0e1a33" stroke="#38e1ff" stroke-opacity=".6" stroke-width="1.5"/>
    </g>
  </defs>

  <g transform="translate(1 11)">
    <use href="#tile"/>
    <rect x="24" width="80" height="2" rx="1" fill="#38e1ff"/>
    <text x="350" y="54" text-anchor="end" class="num" fill="#38e1ff" fill-opacity=".35">01</text>
    <g transform="translate(64 76)">
      <use href="#ring"/>
      <g class="ic">
        <circle cx="-5.5" cy="-3.5" r="8.5"/>
        <circle cx="5.5" cy="-3.5" r="8.5" stroke="#4fffb0"/>
        <circle cy="6" r="8.5" stroke="#a99bff"/>
      </g>
    </g>
    <text x="32" y="156" class="title">Cross-Disciplinary</text>
    <text x="32" y="188" class="body">Flight control, networks, and AI</text>
    <text x="32" y="212" class="body">models designed as one system,</text>
    <text x="32" y="236" class="body">not studied in isolation.</text>
    <g fill="#38e1ff">
      <circle cx="34" cy="258" r="2.2"><animate attributeName="opacity" values="1;.2;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="46" cy="258" r="2.2"><animate attributeName="opacity" values=".2;1;.2;.2" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="258" r="2.2"><animate attributeName="opacity" values=".2;.2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g transform="translate(409 11)">
    <use href="#tile"/>
    <rect x="24" width="80" height="2" rx="1" fill="#4fffb0"/>
    <text x="350" y="54" text-anchor="end" class="num" fill="#4fffb0" fill-opacity=".35">02</text>
    <g transform="translate(64 76)">
      <use href="#ring"/>
      <g class="ic">
        <ellipse cx="-11" cy="13" rx="6" ry="1.8" stroke="#4fffb0"/>
        <path d="M-11 9Q-11 -2 1 -4" stroke-dasharray="2 3.5"/>
        <g transform="translate(7 -7)">
          <path d="M-9 -1H9M-7 -1V-4M7 -1V-4M-10.5 -4.5H-3.5M3.5 -4.5H10.5M-3 2.5L-5 6M3 2.5L5 6" stroke-width="1.6"/>
          <rect x="-3.5" y="-2.5" width="7" height="5" rx="2" fill="#0e1a33" stroke-width="1.6"/>
        </g>
      </g>
    </g>
    <text x="32" y="156" class="title">Simulation to Flight</text>
    <text x="32" y="188" class="body">Ideas validated quickly in</text>
    <text x="32" y="212" class="body">simulation, then taken to real</text>
    <text x="32" y="236" class="body">flights and field tests.</text>
    <g fill="#4fffb0">
      <circle cx="34" cy="258" r="2.2"><animate attributeName="opacity" values="1;.2;.2;1" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></circle>
      <circle cx="46" cy="258" r="2.2"><animate attributeName="opacity" values=".2;1;.2;.2" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="258" r="2.2"><animate attributeName="opacity" values=".2;.2;1;.2" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g transform="translate(817 11)">
    <use href="#tile"/>
    <rect x="24" width="80" height="2" rx="1" fill="#a99bff"/>
    <text x="350" y="54" text-anchor="end" class="num" fill="#a99bff" fill-opacity=".35">03</text>
    <g transform="translate(64 76)">
      <use href="#ring"/>
      <g class="ic">
        <rect x="-11" y="-11" width="22" height="22" rx="3"/>
        <path d="M-4 -11V-15M4 -11V-15M-4 11V15M4 11V15M-11 -4H-15M-11 4H-15M11 -4H15M11 4H15"/>
        <path d="M-3 -4L-7 0L-3 4M3 -4L7 0L3 4" stroke="#4fffb0"/>
      </g>
    </g>
    <text x="32" y="156" class="title">Hardware + Software</text>
    <text x="32" y="188" class="body">Hands-on across embedded systems,</text>
    <text x="32" y="212" class="body">firmware, network protocols,</text>
    <text x="32" y="236" class="body">and machine learning.</text>
    <g fill="#a99bff">
      <circle cx="34" cy="258" r="2.2"><animate attributeName="opacity" values="1;.2;.2;1" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="46" cy="258" r="2.2"><animate attributeName="opacity" values=".2;1;.2;.2" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="258" r="2.2"><animate attributeName="opacity" values=".2;.2;1;.2" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
