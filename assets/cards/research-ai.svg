<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="1200" height="324" role="img" aria-labelledby="title desc">
  <title id="title">Research area 01: AI-Driven Perception and Decision-Making</title>
  <desc id="desc">Research question: How can AI understand its environment and make decisions in real time on drones with limited computing power and energy? Techniques and methods: image recognition, lightweight models, AI agents.</desc>
  <style>
    .label { font: 600 12px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 2.5px; fill: #38e1ff; }
    .title { font: 700 30px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #e8f6ff; }
    .body { font: 400 18px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #cfe3f5; }
    .pill { font: 600 14px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #e8f6ff; }
    .ic { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#0f2142"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2b5cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2b5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38e1ff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eye">
      <path d="M-46 0Q0 -38 46 0Q0 38 -46 0Z"/>
    </clipPath>
  </defs>

  <rect x="1" y="2" width="1198" height="320" rx="16" fill="url(#card)" stroke="#38e1ff" stroke-opacity=".28"/>
  <rect x="1" y="2" width="1198" height="320" rx="16" fill="url(#grid)"/>
  <rect x="24" y="2" width="120" height="2" rx="1" fill="#38e1ff"/>

  <g fill="none" stroke="#38e1ff" stroke-opacity=".35" stroke-width="1.2">
    <path d="M1199 44H1150L1130 64H1086"/>
    <path d="M1199 74H1164L1150 88H1120"/>
  </g>
  <circle cx="1086" cy="64" r="3" fill="#4fffb0" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="88" r="2.5" fill="#a99bff" filter="url(#glow)">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(166 162)">
    <circle r="110" fill="url(#halo)"/>
    <circle r="92" fill="none" stroke="#a99bff" stroke-opacity=".45" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="#0e1a33" stroke="#38e1ff" stroke-opacity=".6" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      <g filter="url(#glow)">
        <circle cx="92" r="3.5" fill="#4fffb0"/>
        <circle cx="-46" cy="80" r="3.5" fill="#bdf7ff"/>
        <circle cx="-46" cy="-80" r="3.5" fill="#a99bff"/>
      </g>
    </g>
    <g class="ic">
      <path d="M-46 0Q0 -38 46 0Q0 38 -46 0Z" stroke="#38e1ff" stroke-width="2.5"/>
      <circle r="16" stroke="#a99bff" stroke-width="2"/>
    </g>
    <circle r="6" fill="#4fffb0" filter="url(#glow)">
      <animate attributeName="r" values="6;7.5;6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <g clip-path="url(#eye)">
      <rect x="-46" y="-24" width="92" height="2" fill="#7fefff" fill-opacity=".8">
        <animate attributeName="y" values="-24;22;-24" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <path d="M318 56V268" stroke="#38e1ff" stroke-opacity=".18"/>

  <text x="350" y="64" class="label">RESEARCH AREA 01</text>
  <text x="350" y="106" class="title">AI-Driven Perception and Decision-Making</text>

  <text x="350" y="150" class="label">RESEARCH QUESTION</text>
  <text x="350" y="180" class="body">How can AI understand its environment and make decisions in real time</text>
  <text x="350" y="206" class="body">on drones with limited computing power and energy?</text>

  <text x="350" y="246" class="label">TECHNIQUES AND METHODS</text>

  <g transform="translate(350 262)">
    <rect width="175" height="30" rx="15" fill="#0e1a33" stroke="#38e1ff" stroke-opacity=".7"/>
    <g transform="translate(19 15)" class="ic" stroke="#38e1ff" stroke-width="1.5">
      <path d="M-8 0Q0 -7 8 0Q0 7 -8 0Z"/>
      <circle r="2.2" fill="#38e1ff"/>
    </g>
    <text x="36" y="20" class="pill">Image Recognition</text>
  </g>
  <g transform="translate(539 262)">
    <rect width="183" height="30" rx="15" fill="#0e1a33" stroke="#4fffb0" stroke-opacity=".7"/>
    <g transform="translate(19 15)" class="ic" stroke="#4fffb0" stroke-width="1.5">
      <path d="M0 -6L7.5 -2.5L0 1L-7.5 -2.5Z"/>
      <path d="M-7.5 1.5L0 5L7.5 1.5"/>
    </g>
    <text x="36" y="20" class="pill">Lightweight Models</text>
  </g>
  <g transform="translate(736 262)">
    <rect width="114" height="30" rx="15" fill="#0e1a33" stroke="#a99bff" stroke-opacity=".7"/>
    <g transform="translate(19 15)" class="ic" stroke="#a99bff" stroke-width="1.5">
      <rect x="-5.5" y="-5.5" width="11" height="11" rx="2"/>
      <path d="M-2.5 -5.5V-8M2.5 -5.5V-8M-2.5 5.5V8M2.5 5.5V8M-5.5 -2.5H-8M-5.5 2.5H-8M5.5 -2.5H8M5.5 2.5H8"/>
      <circle r="1.8" fill="#4fffb0" stroke="none"/>
    </g>
    <text x="36" y="20" class="pill">AI Agents</text>
  </g>
</svg>
